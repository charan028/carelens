name: test-backend
on:
  push: {paths: ["services/api/**", "data/**", ".github/workflows/test-backend.yml"]}
  pull_request: {paths: ["services/api/**", "data/**"]}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: carelens}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    defaults: {run: {working-directory: services/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: python -m pytest -q
      - name: Migrations apply and match the models (PostgreSQL)
        env: {CARELENS_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/carelens"}
        run: alembic upgrade head && alembic check && alembic downgrade base
      - name: Tests on PostgreSQL
        env: {CARELENS_TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/carelens"}
        run: python -m pytest -q
