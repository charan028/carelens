# Local stack with PostgreSQL. Synthetic data only.
#   cp infra/env.example infra/.env && docker compose -f infra/docker-compose.yml up --build
# NOTE: written but not run in the environment where this repo was built.
services:
  db:
    image: postgres:16
    env_file: .env
    volumes: [carelens-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
volumes:
  carelens-db:
